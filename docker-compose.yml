version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: auctionsphere_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: auctionsphere
      POSTGRES_PASSWORD: auctionsphere_pass
      POSTGRES_DB: auctionsphere
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctionsphere"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: auctionsphere_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@auctionsphere.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin

volumes:
  postgres_data:
  pgadmin_data:
